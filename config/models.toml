# SiteVox – Modellkonfiguration
#
# runtime.mode:
#   "demo" – Replay-Fixtures aus data/demo (kein GPU nötig, deterministisch, für Tests/Demo)
#   "gpu"  – echte Modelle; LLMs laufen als OpenAI-kompatible Server (vLLM oder llama.cpp),
#            ASR/Vision/Embedding laufen in-process.
# Überschreibbar mit Umgebungsvariable SITEVOX_MODE.
#
# Grundprinzip: LLMs nur für Verstehen & Schreiben (Extraktion, Zusammenfassung, Entwurf).
# Abweichungen, Soll-Ist, Fristen, Konfidenz → deterministischer Python-Code (sitevox/engine).

[runtime]
mode = "demo"
device = "cuda"            # cuda | mps | cpu
data_dir = "data"
db_path = "data/sitevox.db"
timezone = "Europe/Berlin"

# ---------------------------------------------------------------------------
# 1) Spracherkennung
# ---------------------------------------------------------------------------
[asr]
# whisperx       – GPU, beste Wort-Zeitstempel (wav2vec2-Alignment). word.score = Alignment-Score
# faster_whisper – CTranslate2, word.probability = echte ASR-Wortwahrscheinlichkeit
# mlx_whisper    – Apple Silicon (lokale Entwicklung auf dem Mac)
backend = "whisperx"
model = "large-v3-turbo"                              # whisperx / faster-whisper Alias
hf_repo = "openai/whisper-large-v3-turbo"
mlx_repo = "mlx-community/whisper-large-v3-turbo"
language = "de"
compute_type = "float16"
batch_size = 16
beam_size = 5
vad_filter = true
# Baustellen-Vokabular als initial_prompt (verbessert Erkennung von Fachbegriffen)
initial_prompt = """Baustelle, Bautagebuch, Polier, Bauleiter, Bewehrung, Bewehrungspläne, Schalung,
Betonage, Bodenplatte, Achse C, Index b, Betonpumpe, Bagger, Aushub, Kubikmeter, Tonnen,
Kernbohrung DN150, Behinderung, Nachtrag, Leistungsverzeichnis, LV-Position, Kolonne, Sauberkeitsschicht."""
hotwords = ["Bewehrung", "Schalung", "Betonage", "Polier", "Kernbohrung", "Achse"]

# ---------------------------------------------------------------------------
# 2) LLMs – alle über OpenAI-kompatible Endpunkte (vLLM bevorzugt, llama.cpp als Alternative)
#    Strukturierte Ausgabe via response_format=json_schema (vLLM guided decoding),
#    zusätzlich Pydantic-Validierung + Retry.
# ---------------------------------------------------------------------------
[llm.extractor]
# Strukturierte Extraktion & Klassifikation (Ereignis-JSON). LoRA vorerst nicht aktiv.
role = "extraction"
model = "Qwen/Qwen3-4B-Instruct-2507"
served_name = "qwen3-4b-extract"
base_url = "http://localhost:8001/v1"
api_key = "local"
# Q4-Variante für llama.cpp (~2.5 GB): unsloth/Qwen3-4B-Instruct-2507-GGUF, Datei *Q4_K_M.gguf
gguf_repo = "unsloth/Qwen3-4B-Instruct-2507-GGUF"
gguf_file = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
max_model_len = 16384
temperature = 0.0          # Hauptlauf
sample_temperature = 0.7   # Konsistenz-Sampling für Konfidenz
n_samples = 5              # Anzahl Stichproben je Eingabe (3–5)
max_tokens = 2048
max_retries = 3            # Retries bei Schema-Verletzung
enable_thinking = false    # Instruct-2507 ist ohnehin non-thinking
# lora_adapter = "checkpoints/extract-lora"   # später: --enable-lora --lora-modules

[llm.drafter]
# Briefentwürfe (nur Sachverhalt + Auswirkungen) und Zusammenfassungen.
# Hinweis: Qwen3-8B ist ein dichtes Modell. Wer MoE möchte: Qwen/Qwen3-30B-A3B-Instruct-2507
# (3B aktiv, ~17 GB in Q4) – einfach model/served_name tauschen.
role = "drafting"
model = "Qwen/Qwen3-8B"
served_name = "qwen3-8b-draft"
base_url = "http://localhost:8002/v1"
api_key = "local"
awq_repo = "Qwen/Qwen3-8B-AWQ"     # 4-bit für vLLM (--quantization awq)
max_model_len = 32768
temperature = 0.3
max_tokens = 3072
max_retries = 3
enable_thinking = false             # Qwen3-8B: chat_template_kwargs.enable_thinking=false

[llm.vision]
# Fotobeschreibung (wartende Personen, abgestellte Geräte, Bauzustand). Lazy: nur bei Bedarf laden.
role = "vision"
model = "Qwen/Qwen3-VL-4B-Instruct"
served_name = "qwen3-vl-4b"
backend = "transformers"            # transformers (lazy in-process) | openai (eigener vLLM-Server)
base_url = "http://localhost:8003/v1"
api_key = "local"
lazy_load = true
unload_after_s = 300
max_tokens = 512
temperature = 0.1

# ---------------------------------------------------------------------------
# 3) Retrieval (RAG): Chroma + BGE-M3 dense + BM25, Rerank mit bge-reranker-v2-m3
# ---------------------------------------------------------------------------
[rag]
backend = "chroma"                  # chroma | bm25 (nur lexikalisch, demo-Modus)
persist_dir = "data/index/chroma"
embedding_model = "BAAI/bge-m3"
reranker_model = "BAAI/bge-reranker-v2-m3"
collection_legal = "legal_vob"      # VOB/B (aktuelle Fassung), BGB-Auszüge
collection_project = "project_docs" # LV, Vertrag, Planlieferliste, Protokolle (Filter project_id)
chunk_chars = 900
chunk_overlap = 150
top_k = 8
rerank_top_k = 4
hybrid_alpha = 0.6                  # Anteil dense in der Fusion (Rest BM25)

# ---------------------------------------------------------------------------
# 4) Dokumentparser
# ---------------------------------------------------------------------------
[documents]
backend = "docling"                 # docling | plain (txt/md direkt)
do_ocr = true
do_table_structure = true
ocr_lang = ["de"]

# ---------------------------------------------------------------------------
# 5) Serving (wird von scripts/serve_models.py gelesen)
# ---------------------------------------------------------------------------
[serve]
engine = "vllm"                     # vllm | llama_cpp
gpu_memory_utilization_extractor = 0.25
gpu_memory_utilization_drafter = 0.45
gpu_memory_utilization_vision = 0.20
